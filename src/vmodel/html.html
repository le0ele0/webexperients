<html>

    <meta charset="utf-8">
    <title>Hello, world!</title>
  </head>

 <input type = "text" v-model = "msg">
 <p>{{ msg }}</p>

<p>==============================================================</p>

          data() {
            return {
              msg: 'Hello'
            }
          },
          components: {
            child
          },
          methods: {

          }
        });
        vm.mount("#app");




    </script>
  </body>
</html>
</html>
