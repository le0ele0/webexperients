<!DOCTYPE>
<html>
  <head>
      <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <meta charset="utf-8">
    <title>Hello, world!</title>
  </head>
  <body>
    <div id="app">



 <input type = "text" v-model = "msg">
 <p>{{ msg }}</p>

<p>==============================================================</p>
<child v-model = "msg"></child>

</div>

<!-- 第一个自己实现的组件中v-model双向绑定，上半部分是原生元素的应用，下半是自定义组件。 -->



<script>
        const child ={
            props:["modelValue"],
            template:`
            <p @click= $emit('update:modelValue','hahahahaha') >{{modelValue}}</p>
            `
        }
        const vm = Vue.createApp({
          data() {
            return {
              msg: 'Hello'
            }
          },
          components: {
            child
          },
          methods: {

          }
        });
        vm.mount("#app");




    </script>
  </body>
</html>
</html>
