<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> 
    <script src="https://unpkg.com/vue-router@4"></script> 
    <style>
        .content {
            padding: 10px;
        }
        .top {
            width: 100%;
            height: 45px;
            background: #E0FFFF;
        }
        #list ul {
            margin: 0;
            padding: 0;
        }
        #list ul li {
            color: black;
            font-weight: bold;
            display: block;
            width: 20%;
            height: 55px;
            line-height: 50px;
            text-align: center;
            float: left;
            margin-left: 0;
        }
        .grid {
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .row {
            display: contents;
        }
        .cell {
            background-color: yellow;
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
        .namecontent {
            display: inline-block;
            padding: 10px;
        }
        .subcontent {
            border: 1px solid black;
            width: 80%;
            margin: 0 auto;
            padding: 10px;
        }
        .main {
            border: 1px solid black;
            height: 800px;
            width: 100%;
        }
        .Home_left {
            border: 1px solid black; 
            height: 100%;
            box-sizing: border-box;
            width: 22%;
            float: left;
            background: url(1.jpg) no-repeat left center;
        }
        .Home_right {
            border: 1px solid black; 
            height: 100%;
            box-sizing: border-box;
            width: 22%;
            float: left;
            background: url(2.jpg) no-repeat right center;
        }
        .Home_center {
            border: 1px solid black; 
            height: 100%;
            box-sizing: border-box;
            width: 56%;
            float: left; 
            overflow: auto;
        }
        img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="app1">
        <div class="top">
            <div id="list">
                <ul>
                    <li><router-link to="/" class="router-link">主页</router-link></li>
                    <li><router-link to="/tables/1" class="router-link">组织机构</router-link></li>
                    <li><router-link to="/tables/2" class="router-link">院部设置</router-link></li>
                    <li><router-link to="/teachers" class="router-link">师资队伍</router-link></li>
                    <li><router-link to="/" class="router-link">校内服务</router-link></li>
                </ul>
            </div>
        </div>
        <div class="main">
            <div class="Home_left">
                <img src="img/1.jpg">
            </div>
            <div class="Home_center">
                <router-view></router-view>
            </div>
            <div class="Home_right">
                <img src="img/2.jpg">
            </div>
        </div>
    </div>
</body>
<script>
    const Home = { template: '<div class="content">主页面</div>' };

    const schoolsData = [
        {
            id: 1,
            content: [
                ["科技处", "教务处", "财务处"],
                ["学生处", "后勤处", "人事处"],
                ["工会", "组织部", ""]
            ]
        },
        {
            id: 2,
            content: [
                ["信控学院", "土木学院", "机车学院"],
                ["建筑学院", "环境学院", "理学院"],
                ["管理学院", "商学院", "人外学院"]
            ]
        }
    ];

    const teachersData = [
        { id: 1, name: '张三', info: '博士，教授，博士生导师……' },
        { id: 2, name: '李四', info: '博士，教授，硕士生导师……' },
        { id: 3, name: '王五', info: '博士，教授，硕士生导师……' },
        { id: 4, name: '李白', info: '博士，教授，硕士生导师……' },
        { id: 5, name: '孔子', info: '博士，教授，硕士生导师……' },
        { id: 6, name: '孟子', info: '博士，教授，硕士生导师……' },
        { id: 7, name: '墨子', info: '博士，教授，硕士生导师……' },
        { id: 8, name: '鬼谷子', info: '博士，教授，硕士生导师……' }
    ];

    const Component = {
        data() {
            return {
                Schools: schoolsData,
            }
        },
        template: `
            <div class="grid">
                <div v-for="item in Schools[this.$route.params.name-1].content" :key="item" class="row">
                    <div v-for="subitem in item" :key="subitem" class="cell">
                        {{ subitem }}
                    </div>
                </div>
            </div>
            <a href="#" @click="$router.push('/')">返回主页</a>
        `
    };

    const Teachers = {
        data() {
            return {
                teachers: teachersData,
            }
        },
        template: `
            <div class="content">
                <div v-for="person in teachers" :key="person.id" class="namecontent">
                    <router-link :to="'/teachers/teacher/' + person.id">
                        {{ person.name }}
                    </router-link>
                </div>
                <router-view></router-view>
            </div>
        `
    };

    const People = {
        data() {
            return {
                teachers: teachersData,
            }
        },
        template: `
            <div class="subcontent">
                <p style="color:red;font-size:20px; font-weight:bold;">
                    {{ teachers[this.$route.params.id-1].name }}
                </p>
                {{ teachers[this.$route.params.id-1].info }}
            </div>
        `
    }

    const routes = [
        { path: '/', component: Home },
        { path: '/tables/:name', component: Component },
        {
            path: '/teachers', component: Teachers,
            children: [
                { path: 'teacher/:id', component: People }
            ]
        },
    ];
    const router = VueRouter.createRouter({
        history: VueRouter.createWebHashHistory(),
        routes
    });
    const app = Vue.createApp({});
    app.use(router);
    app.mount('#app1');
</script>
</html>
